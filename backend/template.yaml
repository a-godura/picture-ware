AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  picture-ware backend - Cognito-authenticated HTTP API + Go Lambdas that
  store each user's photos in S3 and their location metadata in DynamoDB,
  with a budget-driven kill switch.
  Deploy as stack "picture-ware": IAM roles must be named picture-ware-*.

Parameters:
  ThrottleRateLimit:
    Type: Number
    Default: 5
    MinValue: 0
    Description: HTTP API default route steady-state requests per second.
  ThrottleBurstLimit:
    Type: Number
    Default: 10
    MinValue: 0
    Description: HTTP API default route burst limit.
  KillSwitchUSD:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Monthly actual account cost (USD) above which the kill switch disables the API.
  AuthDomainPrefix:
    Type: String
    Default: picture-ware-agodura
    AllowedPattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: Cognito hosted UI domain prefix (https://<prefix>.auth.<region>.amazoncognito.com).
  DownloadTripwireBytes:
    Type: Number
    Default: 5368709120
    MinValue: 1
    Description: >
      S3 bytes downloaded from the photo bucket in any rolling 60 minutes
      (evaluated every minute) above which the tripwire blocks all photo
      downloads until scripts/tripwire-reset.sh is run. Default 5 GiB.
  TripwireAlertEmail:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+$"
    Description: Optional email address subscribed to the tripwire topic (AWS sends a confirmation email first). Empty = no subscription.
  UploadsPerUserPerDay:
    Type: Number
    Default: 300
    MinValue: 0
    Description: Trip photo upload URLs each user may get per UTC day (POST /trips/{tripId}/photos; 429 above it).
  StoragePerUserBytes:
    Type: Number
    Default: 5368709120
    MinValue: 0
    Description: Trip photo bytes each user may store, counting 15 MiB per in-flight upload (default 5 GiB).
  StorageTotalBytes:
    Type: Number
    Default: 53687091200
    MinValue: 0
    Description: Trip photo bytes stored across all users, counting 15 MiB per in-flight upload (default 50 GiB).

Conditions:
  HasTripwireAlertEmail: !Not [!Equals [!Ref TripwireAlertEmail, ""]]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Handler: bootstrap
    MemorySize: 128
    Timeout: 10
    Tags:
      app: picture-ware

Resources:
  # ---------- Storage ----------
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Request metrics (1-minute, near-real-time) for the whole bucket; the
      # download tripwire alarms on BytesDownloaded. Billed as CloudWatch
      # custom metrics (16 metrics, prorated by the hours they are emitted).
      MetricsConfigurations:
        - Id: EntireBucket

  PhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotosBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt PhotosBucket.Arn
              - !Sub "${PhotosBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # One table for trips, members and photos, keyed by generic PK/SK strings
  # (see internal/photos/store.go for the item shapes).
  AppTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Hard ceiling on on-demand throughput (and so on request spend):
      # requests above it are throttled, not billed.
      OnDemandThroughput:
        MaxReadRequestUnits: 100
        MaxWriteRequestUnits: 50

  # Legacy per-user photo table, used only by the /photos routes. Remove
  # (with internal/legacy) once no client calls /photos.
  PhotosByUserTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE

  # ---------- Auth ----------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: picture-ware-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      UserPoolTags:
        app: picture-ware

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuthDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 1

  # Public client used by the iOS app: authorization code + PKCE via the
  # hosted UI. Cognito has no "require PKCE" switch; public clients without a
  # secret are expected to always send code_challenge.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: picture-ware-ios
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: ["picture-ware://auth/callback"]
      LogoutURLs: ["picture-ware://auth/signout"]
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Test-only client for scripts/smoke.sh: admin (IAM-authenticated) password
  # auth, no OAuth, no hosted UI. Not for app use.
  SmokeTestClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: picture-ware-smoke-test
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # ---------- API ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Every route requires a Cognito access token (Authorization: Bearer).
      # HTTP API matches an access token's client_id claim against audience.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
                - !Ref SmokeTestClient
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/api/
      Description: picture-ware /trips API (+ legacy /photos)
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          LEGACY_TABLE_NAME: !Ref PhotosByUserTable
          BUCKET_NAME: !Ref PhotosBucket
          QUOTA_DAILY_UPLOADS: !Ref UploadsPerUserPerDay
          QUOTA_USER_BYTES: !Ref StoragePerUserBytes
          QUOTA_TOTAL_BYTES: !Ref StorageTotalBytes
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:DeleteItem]
              Resource: [!GetAtt AppTable.Arn, !GetAtt PhotosByUserTable.Arn]
            - Effect: Allow
              # Upload quota counters (reserve on create, release on delete).
              Action: dynamodb:UpdateItem
              Resource: !GetAtt AppTable.Arn
            - Effect: Allow
              # PutObject backs the presigned POST, GetObject the presigned GET.
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource:
                - !Sub "${PhotosBucket.Arn}/trips/*"
                - !Sub "${PhotosBucket.Arn}/photos/*"
      Events:
        ListTrips:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /trips
        CreateTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /trips
        GetTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /trips/{tripId}
        ListTripPhotos:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /trips/{tripId}/photos
        CreateTripPhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /trips/{tripId}/photos
        DeleteTripPhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /trips/{tripId}/photos/{photoId}
        CreatePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /photos
        ListPhotos:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /photos
        DeletePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /photos/{id}

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/processor/
      Description: picture-ware marks photos ready on S3 ObjectCreated
      Environment:
        Variables:
          TABLE_NAME: !Ref AppTable
          LEGACY_TABLE_NAME: !Ref PhotosByUserTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # MarkReady reads the pending record, then (in one transaction)
              # updates it, puts its listing copy, deletes its upload
              # reservation and updates the usage counters.
              Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt AppTable.Arn
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt PhotosByUserTable.Arn
      Events:
        PhotoUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PhotosBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: photos/
        TripPhotoUploaded:
          Type: S3
          Properties:
            Bucket: !Ref PhotosBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: trips/

  ProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessorFunction}
      RetentionInDays: 14

  # ---------- Cost kill switch ----------
  KillSwitchTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: picture-ware kill switch

  KillSwitchTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref KillSwitchTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref KillSwitchTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:*

  KillSwitchBudget:
    Type: AWS::Budgets::Budget
    DependsOn: KillSwitchTopicPolicy
    Properties:
      Budget:
        BudgetName: picture-ware-killswitch
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref KillSwitchUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref KillSwitchTopic

  KillSwitchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/killswitch/
      Description: picture-ware budget kill switch - throttles API to 0 and zeroes Lambda concurrency
      Timeout: 30
      Environment:
        Variables:
          API_ID: !Ref HttpApi
          STAGE_NAME: $default
          FUNCTION_NAMES: !Sub "${ApiFunction},${ProcessorFunction}"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: apigateway:PATCH
              Resource: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApi}/stages/$default
            - Effect: Allow
              Action: lambda:PutFunctionConcurrency
              Resource:
                - !GetAtt ApiFunction.Arn
                - !GetAtt ProcessorFunction.Arn
      Events:
        BudgetExceeded:
          Type: SNS
          Properties:
            Topic: !Ref KillSwitchTopic

  KillSwitchFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${KillSwitchFunction}
      RetentionInDays: 14

  # ---------- Download tripwire ----------
  # Presigned GET URLs are served by S3 without the API throttle, and the
  # budget kill switch lags billing data by 8-24 h. This alarm watches the
  # bucket's request metrics and, within minutes, has TripwireFunction deny
  # s3:GetObject on photos/* and trips/* until scripts/tripwire-reset.sh runs.
  TripwireTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: picture-ware download tripwire

  TripwireTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref TripwireTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref TripwireTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*

  TripwireEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasTripwireAlertEmail
    Properties:
      TopicArn: !Ref TripwireTopic
      Protocol: email
      Endpoint: !Ref TripwireAlertEmail

  DownloadTripwireAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: TripwireTopicPolicy
    Properties:
      AlarmName: !Sub ${AWS::StackName}-download-tripwire
      AlarmDescription: >
        S3 download volume from the photo bucket exceeded DownloadTripwireBytes
        in a rolling hour; TripwireFunction has denied s3:GetObject on photos/*
        and trips/*. Investigate, then run backend/scripts/tripwire-reset.sh.
      Namespace: AWS/S3
      MetricName: BytesDownloaded
      Dimensions:
        - Name: BucketName
          Value: !Ref PhotosBucket
        - Name: FilterId
          Value: EntireBucket
      Statistic: Sum
      # 1-hour sliding window, re-evaluated every minute.
      Period: 3600
      EvaluationPeriods: 1
      Threshold: !Ref DownloadTripwireBytes
      ComparisonOperator: GreaterThanThreshold
      # S3 only emits request metrics while there is traffic.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref TripwireTopic]

  TripwireFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: cmd/tripwire/
      Description: picture-ware download tripwire - denies s3:GetObject on photo prefixes via the bucket policy
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Ref PhotosBucket
          BUCKET_ARN: !GetAtt PhotosBucket.Arn
          PROTECTED_PREFIXES: photos/,trips/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [s3:GetBucketPolicy, s3:PutBucketPolicy]
              Resource: !GetAtt PhotosBucket.Arn
      Events:
        DownloadAlarm:
          Type: SNS
          Properties:
            Topic: !Ref TripwireTopic

  TripwireFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TripwireFunction}
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  BucketName:
    Description: Photo bucket
    Value: !Ref PhotosBucket
  LegacyTableName:
    Description: Legacy per-user photo table (/photos routes)
    Value: !Ref PhotosByUserTable
  TableName:
    Description: App table for trips, members and photos (generic PK/SK)
    Value: !Ref AppTable
  UserPoolId:
    Description: Cognito user pool id (JWT issuer is https://cognito-idp.<region>.amazonaws.com/<UserPoolId>)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public app client id for the iOS app (code + PKCE)
    Value: !Ref UserPoolClient
  SmokeTestClientId:
    Description: Test-only client used by scripts/smoke.sh (admin password auth)
    Value: !Ref SmokeTestClient
  AuthDomain:
    Description: Cognito hosted UI base URL
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  ApiId:
    Description: HTTP API id (used by killswitch-reset.sh)
    Value: !Ref HttpApi
  ApiFunctionName:
    Description: API Lambda name (used by killswitch-reset.sh)
    Value: !Ref ApiFunction
  ProcessorFunctionName:
    Description: Processor Lambda name (used by killswitch-reset.sh)
    Value: !Ref ProcessorFunction
  KillSwitchTopicArn:
    Description: SNS topic the budget notifies
    Value: !Ref KillSwitchTopic
  DownloadTripwireAlarmName:
    Description: CloudWatch alarm that trips the download block (used by tripwire-reset.sh)
    Value: !Ref DownloadTripwireAlarm
  TripwireTopicArn:
    Description: SNS topic the download tripwire alarm notifies (subscribe for alerts)
    Value: !Ref TripwireTopic
