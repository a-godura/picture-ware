name: contract

# Fails a PR whose api/openapi.yaml would break clients built against main's
# contract (removed routes/fields, new required inputs, ...). Additive changes
# pass. Operations marked `x-planned: true` on main were never deployed, so
# they are dropped from main's copy before comparing: they may change freely
# until their backend PR deploys them and removes the marker. A deliberate breaking change (e.g. removing a route no client uses any
# more) needs the `breaking-change-approved` label on the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OASDIFF_VERSION: v1.33.0

jobs:
  breaking-changes:
    name: contract / breaking-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get main's contract
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:api/openapi.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on the base branch yet; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.base.outputs.exists == 'true'
        with:
          go-version: stable
          cache: false

      - name: Install oasdiff
        if: steps.base.outputs.exists == 'true'
        run: go install "github.com/oasdiff/oasdiff@$OASDIFF_VERSION"

      - name: Drop planned (never deployed) operations from main's contract
        if: steps.base.outputs.exists == 'true'
        working-directory: backend
        run: go run ./tools/dropplanned < "$RUNNER_TEMP/base.yaml" > "$RUNNER_TEMP/base-deployed.yaml"

      - name: Check for breaking changes
        if: steps.base.outputs.exists == 'true'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        run: |
          {
            echo "### API contract changes"
            echo '```'
            oasdiff changelog "$RUNNER_TEMP/base-deployed.yaml" api/openapi.yaml || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if oasdiff breaking "$RUNNER_TEMP/base-deployed.yaml" api/openapi.yaml --fail-on ERR; then
            echo "No breaking changes."
          elif [ "$APPROVED" = "true" ]; then
            echo "::warning::Breaking contract change allowed by the breaking-change-approved label."
          else
            echo "::error::Breaking change to api/openapi.yaml. Make it additive, or add the breaking-change-approved label if it's deliberate."
            exit 1
          fi
