# One-time setup: lets GitHub Actions in a-godura/picture-ware deploy to AWS
# without stored keys. Deploy this ONCE with an admin login (CloudFormation console).
#
# Creates:
#   - GitHub's OIDC identity provider in IAM
#   - Role picture-ware-github-deploy, assumable only by workflows running on
#     the `main` branch of this repo, with the same permissions as the
#     PictureWareDeveloper Identity Center role.
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC deploy role for picture-ware

Parameters:
  GitHubRepoSubject:
    Type: String
    Default: a-godura@223130536/picture-ware@1400781056
    Description: >-
      Repo part of GitHub's OIDC `sub` claim. This repo uses GitHub's immutable
      subject format (owner@ownerId/repo@repoId), which survives renames. Check with
      `gh api repos/OWNER/REPO/actions/oidc/customization/sub` (sub_claim_prefix).
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if token.actions.githubusercontent.com already exists in this account

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: picture-ware-github-deploy
      Description: Assumed by GitHub Actions on main to deploy the backend
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepoSubject}:ref:refs/heads/main
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ProjectRolesOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/picture-ware-*

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
